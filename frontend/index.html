<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SatLab Mission Control</title>
    <script>
      // Apply the theme before first paint (no flash). Keep in sync with src/lib/theme.ts.
      try {
        var p = localStorage.getItem('satlab.theme') || 'dark'
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark') // storage blocked: the default is dark
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
