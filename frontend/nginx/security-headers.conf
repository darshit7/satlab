# Included in every location that sets its own add_header (nginx doesn't inherit them then).
# __CSP_SCRIPT_HASHES__ is replaced at image build time by scripts/csp-script-hashes.mjs.
# Map tiles, styles, glyphs and sprites: tiles.openfreemap.org. Analytics: Umami Cloud.
# font-src data:: Vite inlines small font subsets (fontsource) into the CSS as data: URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__ https://cloud.umami.is; connect-src 'self' https://tiles.openfreemap.org https://cloud.umami.is https://gateway.umami.is; img-src 'self' data: blob: https://tiles.openfreemap.org; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
