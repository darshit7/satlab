# The documentation site's headers (/satlab/docs/), included like security-headers.conf is.
# __DOCS_CSP_SCRIPT_HASHES__ is replaced at image build time by scripts/csp-script-hashes.mjs, run
# over the whole built site: Furo's theme line and the Mermaid init are its only inline scripts.
# No external host at all: Mermaid and the fonts are vendored from the frontend lockfile.
# style-src 'unsafe-inline': Furo's CSS variables and Mermaid's SVG styles are inline <style>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __DOCS_CSP_SCRIPT_HASHES__; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=()" always;
