# Which docs pages explain which code. See how-to/write-docs.md ("The sync map").
#
# When you change a file, update the pages its entries list, in the same change (AGENTS.md golden
# rule 11). backend/tests/test_docs_sync.py fails when a source file isn't covered by any entry, an
# entry's path matches nothing, or a page doesn't exist; so a new module, view or deploy file needs
# a decision about which page explains it.
#
# paths: repo-relative globs; a trailing "/" means everything under that directory.
# pages: docnames (paths under docs/ without the extension).

# ---------- backend: API surface and contract ----------

[[entry]]
paths = ["backend/app/main.py"]
pages = ["architecture/session-lifecycle", "reference/rest", "reference/websocket"]

[[entry]]
paths = ["backend/app/models/ws.py"]
pages = ["reference/websocket", "how-to/change-ws-contract", "architecture/tick"]

[[entry]]
paths = ["backend/app/models/api.py"]
pages = ["reference/rest"]

[[entry]]
paths = ["backend/app/config.py"]
pages = ["reference/settings", "how-to/add-setting"]

# ---------- backend: persistence ----------

[[entry]]
paths = ["backend/app/db/base.py", "backend/app/db/models.py", "backend/migrations/"]
pages = ["architecture/persistence", "reference/database", "how-to/add-migration"]

[[entry]]
