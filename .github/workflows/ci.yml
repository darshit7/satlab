# Checks every change. Required to pass before a PR into main can merge (main's ruleset), and
# re-run by deploy.yml on the merge result before anything ships.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.1" # keep in sync with backend/Dockerfile
  PNPM_VERSION: "10.33.1" # keep in sync with frontend/Dockerfile
  NODE_VERSION: "24"

jobs:
  # main only ever receives dev: every change is integrated (and CI-checked) there first.
  source-branch:
    name: source-branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from dev in this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ $HEAD_REF != dev || $HEAD_REPO != "$REPO" ]]; then
            echo "::error::PRs into main must come from $REPO:dev (got $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest (SQLite)
        run: uv run pytest
        env:
          SATLAB_TEST_POSTGRES_URL: "" # force SQLite; Postgres runs in the next job

  # The same suite on the Neon `test` branch (owner, direct host): every change must work on both
  # dialects (AGENTS.md §8.1). One throwaway schema per test, so parallel runs don't collide.
  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SATLAB_TEST_POSTGRES_URL: ${{ secrets.SATLAB_TEST_POSTGRES_URL }}
    steps:
      - name: Skip without the Neon test secret (e.g. PRs from forks)
        if: env.SATLAB_TEST_POSTGRES_URL == ''
        working-directory: .
        run: echo "::notice::SATLAB_TEST_POSTGRES_URL is not set; Postgres tests skipped."
      - if: env.SATLAB_TEST_POSTGRES_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.SATLAB_TEST_POSTGRES_URL != ''
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: env.SATLAB_TEST_POSTGRES_URL != ''
        run: uv sync --frozen
      - name: pytest (Postgres on Neon)
        if: env.SATLAB_TEST_POSTGRES_URL != ''
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Both production images build, and work together: nginx serves the app, proxies REST and
  # WebSocket to the API, and sends the security headers (scripts/smoke.sh).
  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: satlab-api:ci
          cache-from: type=gha,scope=satlab-api
          cache-to: type=gha,scope=satlab-api,mode=max
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: satlab-web:ci
          cache-from: type=gha,scope=satlab-web
          cache-to: type=gha,scope=satlab-web,mode=max
      - name: Start both containers
        run: |
          docker network create satlab
          # SQLite inside the container, no Celestrak download: the smoke test needs neither.
          docker run -d --name api --network satlab -p 8000:8000 \
            -e SATLAB_AUTO_MIGRATE=true -e SATLAB_CATALOG_AUTOLOAD=false \
            -e SATLAB_DOCS_ENABLED=false -e 'SATLAB_CORS_ORIGINS=["http://localhost:8080"]' \
            satlab-api:ci
          docker run -d --name web --network satlab -p 8080:8080 \
            -e SATLAB_API_UPSTREAM=http://api:8000 satlab-web:ci
          for _ in $(seq 60); do
            curl -sf http://localhost:8080/satlab/api/health && exit 0
            sleep 1
          done
          echo "::error::containers did not become healthy"
          exit 1
      - name: Smoke test
        run: scripts/smoke.sh http://localhost:8080 http://localhost:8000 http://localhost:8080
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs web || true
